name: medir-cortes

# Repositorio publico: aqui no hay claves ni direcciones. El video y la direccion de entrega
# los pide el script a n8n con secretos del repositorio (N8N_JOB_URL y CALLBACK_TOKEN).
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Identificador del trabajo (letras, numeros, - y _)"
        required: true

permissions:
  contents: read

concurrency:
  group: cortes-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  cortes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Medir cortes
        env:
          JOB_ID: ${{ inputs.job_id }}
          N8N_JOB_URL: ${{ secrets.N8N_JOB_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
        run: python3 medir_cortes.py --job-id "$JOB_ID" --out resultado.json
